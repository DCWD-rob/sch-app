<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Book</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav class="header">
        <a href="index.html" class="headerbox">Home</a>
        <a href="contact.html" class="headerbox">Contacts</a>
        <a href="agent_sales.html" class="headerbox">Sales</a>
        <a href="open_house.html" class="headerbox">Open House</a>
    </nav>
</header>

<h1>Phone Book</h1>

<div id="allContacts_output"></div>

<form id="contactForm">
    <p>Fill out form to add a new contact</p>
    <p>Fill in at least 1 input box to search</p>

    <label>
        First Name
        <input id="fname" type="text">
    </label>

    <label>
        Last Name
        <input id="lname" type="text">
    </label>

    <label>
        Address
        <input id="address" type="text">
    </label>

    <label>
        Phone
        <input id="phone" type="tel">
    </label>

    <label>
        Email
        <input id="email" type="email">
    </label>

    <div class="button-group">
        <button id="myButton" type="button">Save Contact</button>
        <button id="loadButton" type="button">Show All Contacts</button>
    </div>
</form>

<div id="output">
    <p id="fname_output"></p>
    <p id="lname_output"></p>
    <p id="address_output"></p>
    <p id="phone_output"></p>
    <p id="email_output"></p>
</div>

<script src="contact.js"></script>
</body>
</html>
