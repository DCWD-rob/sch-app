<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    font-family: Arial;
    padding: 10px;
  }

  input, select, button {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    font-size: 16px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  td, th {
    border: 1px solid #ccc;
    padding: 8px;
  }

  button {
    background: green;
    color: white;
    border: none;
    border-radius: 5px;
  }

  .view-box {
    border: 1px solid #ccc;
    padding: 10px;
    margin-top: 15px;
  }
</style>
</head>
<body>

<h3>Client Info</h3>

<input id="fname" placeholder="First name">
<input id="lname" placeholder="Last name">
<input id="address" placeholder="Address">
<input id="phone" placeholder="Phone">
<input id="email" placeholder="Email">

<h3>Tasks</h3>

<table>
  <tr>
    <th>Task</th>
    <th>Status</th>
  </tr>
  <tbody id="tasks"></tbody>
</table>

<br>

<button id="saveBtn">Save Data</button>
<button id="viewBtn">View Saved Data</button>

<p id="message"></p>

<div id="view" class="view-box"></div>

<script>
const tasks = [
  "mandatory licenses consumer",
  "MA-Exc buyers agency agreement",
  "TRID addendum",
  "lender approval",
  "deed",
  "MLS Listing",
  "contract to purchase Real estate",
  "offer deposit",
  "lead paint notice",
  "MA standard P and S agreement",
  "P and S deposit",
  "MA notice of designated agency",
  "facts for consumers",
  "sellers real estate info statement",
  "closing documents",
  "DA"
];

const taskBody = document.getElementById("tasks");
const saved = JSON.parse(localStorage.getItem("formData")) || { tasks: {} };

// Populate tasks table
tasks.forEach(task => {
  const status = saved.tasks[task] || "Not Completed";
  const tr = document.createElement("tr");

  const tdTask = document.createElement("td");
  tdTask.textContent = task;

  const tdSelect = document.createElement("td");
  const select = document.createElement("select");
  const option1 = document.createElement("option");
  option1.value = "Not Completed";
  option1.text = "Not Completed";
  const option2 = document.createElement("option");
  option2.value = "Completed";
  option2.text = "Completed";

  select.add(option1);
  select.add(option2);

  select.value = status;

  tdSelect.appendChild(select);

  tr.appendChild(tdTask);
  tr.appendChild(tdSelect);

  taskBody.appendChild(tr);
});

// Populate input fields
document.getElementById("fname").value = saved.fname || "";
document.getElementById("lname").value = saved.lname || "";
document.getElementById("address").value = saved.address || "";
document.getElementById("phone").value = saved.phone || "";
document.getElementById("email").value = saved.email || "";

// Save button
document.getElementById("saveBtn").addEventListener("click", () => {
  const data = {
    fname: document.getElementById("fname").value,
    lname: document.getElementById("lname").value,
    address: document.getElementById("address").value,
    phone: document.getElementById("phone").value,
    email: document.getElementById("email").value,
    tasks: {}
  };

  document.querySelectorAll("#tasks tr").forEach(row => {
    const task = row.children[0].textContent;
    const status = row.children[1].children[0].value;
    data.tasks[task] = status;
  });

  localStorage.setItem("formData", JSON.stringify(data));
  document.getElementById("message").innerText = "Saved ✔";
});

// View button
document.getElementById("viewBtn").addEventListener("click", () => {
  const data = JSON.parse(localStorage.getItem("formData"));
  if (!data) {
    document.getElementById("view").innerText = "No saved data found";
    return;
  }

  let html = `<strong>Client Info</strong><br>
              Name: ${data.fname} ${data.lname}<br>
              Address: ${data.address}<br>
              Phone: ${data.phone}<br>
              Email: ${data.email}<br><br>
              <strong>Tasks</strong><br>`;

  for (let task in data.tasks) {
    html += `${task}: ${data.tasks[task]}<br>`;
  }

  document.getElementById("view").innerHTML = html;
});
</script>

</body>
</html>
