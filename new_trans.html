\<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real Estate Tasks</title>
<style>
  body {
    font-family: Arial;
    padding: 10px;
    background: #f8f8f8;
  }

  h3 {
    margin-top: 20px;
  }

  input, select, button {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    font-size: 16px;
    border-radius: 5px;
    border: 1px solid #ccc;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    background: #fff;
  }

  td, th {
    border: 1px solid #ccc;
    padding: 8px;
    text-align: left;
  }

  button {
    background: #28a745;
    color: white;
    border: none;
    margin-top: 10px;
  }

  .view-box {
    border: 1px solid #ccc;
    padding: 10px;
    margin-top: 15px;
    background: #fff;
  }
</style>
</head>
<body>

<h2>Client Info & Tasks</h2>

<h3>Client Info</h3>
<input id="fname" placeholder="First name">
<input id="lname" placeholder="Last name">
<input id="address" placeholder="Address">
<input id="phone" placeholder="Phone">
<input id="email" placeholder="Email">

<h3>Tasks</h3>
<table>
  <tr>
    <th>Task</th>
    <th>Status</th>
  </tr>
  <tbody id="tasks"></tbody>
</table>

<button id="saveBtn">Save Data</button>
<p id="message"></p>

<script>
const tasksList = [
  "mandatory licenses consumer",
  "MA-Exc buyers agency agreement",
  "TRID addendum",
  "lender approval",
  "deed",
  "MLS Listing",
  "contract to purchase Real estate",
  "offer deposit",
  "lead paint notice",
  "MA standard P and S agreement",
  "P and S deposit",
  "MA notice of designated agency",
  "facts for consumers",
  "sellers real estate info statement",
  "closing documents",
  "DA"
];

const tasksBody = document.getElementById("tasks");

// Load saved data or start fresh
const savedData = JSON.parse(localStorage.getItem("formData")) || { tasks: {} };

// Populate inputs
document.getElementById("fname").value = savedData.fname || "";
document.getElementById("lname").value = savedData.lname || "";
document.getElementById("address").value = savedData.address || "";
document.getElementById("phone").value = savedData.phone || "";
document.getElementById("email").value = savedData.email || "";

// Populate task table
tasksList.forEach(task => {
  const status = savedData.tasks[task] || "Not Completed";

  const tr = document.createElement("tr");

  const tdTask = document.createElement("td");
  tdTask.textContent = task;

  const tdSelect = document.createElement("td");
  const select = document.createElement("select");

  const option1 = document.createElement("option");
  option1.value = "Not Completed";
  option1.text = "Not Completed";
  const option2 = document.createElement("option");
  option2.value = "Completed";
  option2.text = "Completed";

  select.add(option1);
  select.add(option2);
  select.value = status;

  tdSelect.appendChild(select);
  tr.appendChild(tdTask);
  tr.appendChild(tdSelect);

  tasksBody.appendChild(tr);
});

// Save button
document.getElementById("saveBtn").addEventListener("click", () => {
  const dataToSave = {
    fname: document.getElementById("fname").value,
    lname: document.getElementById("lname").value,
    address: document.getElementById("address").value,
    phone: document.getElementById("phone").value,
    email: document.getElementById("email").value,
    tasks: {}
  };

  document.querySelectorAll("#tasks tr").forEach(row => {
    const task = row.children[0].textContent;
    const status = row.children[1].children[0].value;
    dataToSave.tasks[task] = status;
  });

  try {
    localStorage.setItem("formData", JSON.stringify(dataToSave));
    document.getElementById("message").innerText = "Saved ✔";
  } catch(e) {
    console.error(e);
    document.getElementById("message").innerText = "Cannot save: make sure app is loaded from GitHub Pages or HTTPS origin.";
  }
});
</script>

</body>
</html>
