<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open House Sign-In</title>

  <link rel="stylesheet" href="style.css">
  <script src="https://kit.fontawesome.com/0aacbb7f3b.js" crossorigin="anonymous"></script>
</head>

<body>

  <!-- Unified Header -->
  <header class="app-header">
    <div class="header-inner">
      <div class="logo">Stacey Curran Homes</div>

      <button class="menu-toggle" aria-label="Toggle navigation">
        <i class="fa-solid fa-bars"></i>
      </button>

      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="contact.html">Contacts</a>
        <a href="agent_sales.html">Sales</a>
        <a href="open_house.html" class="active">Open House</a>
        <a href="mlssearch.html">Search Listings</a>
      </nav>
    </div>
  </header>

  <!-- Page Content -->
  <main class="page-content iframe-page">
    <iframe
      src="https://staceycurranhomes.com/app_mls_search_shell.php"
      class="mls-iframe">
    </iframe>
  </main>

  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script>
    emailjs.init("0QvLx2yuvBvzkzWlG");
  </script>

  <!-- Mobile menu toggle -->
  <script>

  function setVh() {
    document.documentElement.style.setProperty(
      "--vh",
      `${window.innerHeight * 0.01}px`
    );
  }

  setVh();
  window.addEventListener("resize", setVh);


    const toggle = document.querySelector(".menu-toggle");
    const nav = document.querySelector(".nav-links");

    toggle.addEventListener("click", () => {
      nav.classList.toggle("show");
    });
  </script>

</body>
</html>
