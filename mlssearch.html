<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>MLS</title>

    <style>
        .header {
  display: flex;
  flex-wrap: nowrap;
  justify-content: center;
  gap: 0.3rem;
  padding: 0.75rem;
  background: #6b3370;
  overflow-x: auto;
}

.headerbox {
  color: white;
  text-decoration: none;
  background: #998099;
  padding: 0.6rem 1rem;
  border-radius: 6px;
  font-size: 0.9rem;
  white-space: nowrap;
}

.header::-webkit-scrollbar {
  display: none;
}
.mobile-nav {
    background: #6b3370;
    color: white;
    position: sticky;
    top: 0;
    z-index: 1000;
}

.nav-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.75rem 1rem;
}

.app-title {
    font-size: 1rem;
    font-weight: bold;
}

.menu-btn {
    font-size: 1.6rem;
    background: none;
    border: none;
    color: white;
    cursor: pointer;
}

.menu {
    display: none;
    background: #7d4a82;
}

.menu a {
    display: block;
    padding: 0.9rem 1rem;
    color: white;
    text-decoration: none;
    border-top: 1px solid rgba(255,255,255,0.2);
}

.menu a:hover {
    background: #998099;
}

        body {
            font-family: Arial, sans-serif;
            padding: 10px;
            margin: 0;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
            margin-bottom: 15px;
        }

        /* Filter bar */
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
            justify-content: center;
        }

        select, input[type="text"] {
            padding: 10px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
            width: 100%;
            max-width: 250px;
        }

        /* Responsive table wrapper */
        .table-wrapper {
            overflow-x: auto;
            background: white;
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            font-size: 14px;
            vertical-align: top;
        }

        th {
            background: #eee;
        }

        img {
            border-radius: 4px;
        }

        /* Pagination buttons */
        .pagination {
            text-align: center;
            margin-top: 15px;
        }

        .pagination button {
            padding: 10px 18px;
            margin: 0 5px;
            font-size: 16px;
            border-radius: 6px;
            border: none;
            background: #0078ff;
            color: white;
        }

        .pagination button:disabled {
            background: #999;
        }

        @media (max-width: 600px) {
            th, td {
                font-size: 13px;
                padding: 6px;
            }
        }
    </style>
</head>

<body>
    <header>
  <nav class="mobile-nav">
    <div class="nav-bar">
        <span class="app-title">MLS App</span>
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
    </div>

    <div id="menu" class="menu">
        <a href="index.html">Home</a>
        <a href="contact.html">Contacts</a>
        <a href="agent_sales.html">Sales</a>
        <a href="open_house.html">Open House</a>
        <a href="mlssearch.html">Search Listings</a>
        <a href="convert.html">Import MLS</a>
    </div>
</nav>

</header>
    <h1>MLS List</h1>

    <!-- Filter Controls -->
    <div class="filters">
        <select id="townSort" onchange="TownDropdown()"> 
            <option value="">-- City/Town Sort --</option> 
            <option value="townAZ">Sort Town A → Z</option> 
            <option value="townZA">Sort Town Z → A</option> 
        </select>

        <select id="priceSort" onchange="PriceDropdown()"> 
            <option value="">-- Price Sort --</option> 
            <option value="priceHigh">Price High → Low</option> 
            <option value="priceLow">Price Low → High</option> 
        </select>

        <select id="countySelect" onchange="handleCounty()">
            <option value="">-- Sort by County --</option>
            <option value="Middlesex">Middlesex</option>
            <option value="Essex">Essex</option>
            <option value="Suffolk">Suffolk</option>
            <option value="Norfolk">Norfolk</option>
            <option value="Worcester">Worcester</option>
            <option value="Barnstable">Barnstable</option>
            <option value="Dukes">Dukes</option>
        </select>

        <input 
            type="text" 
            id="remarkSearch" 
            placeholder="keyword search..." 
            oninput="searchRemarks()"
        >
    </div>

    <div id="output" class="table-wrapper"></div>

<script>
/* -----------------------------
   IndexedDB Setup
----------------------------- */
const DB_NAME = "MLS_APP";
const STORE_NAME = "listings";

function openDB() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = e => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME, { autoIncrement: true });
            }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}

function loadListings() {
    return openDB().then(db => {
        return new Promise(resolve => {
            const tx = db.transaction(STORE_NAME, "readonly");
            const store = tx.objectStore(STORE_NAME);
            const req = store.getAll();
            req.onsuccess = () => resolve(req.result || []);
        });
    });
}

/* -----------------------------
   Global Variables
----------------------------- */
let mlsData = {};      // key: LIST_NO or fallback
let zipLookup = {};
let currentPage = 1;
let itemsPerPage = 20;
let currentList = [];

/* -----------------------------
   Load ZIP codes + MLS listings
----------------------------- */
Promise.all([
    fetch("zipcode.txt").then(r => r.text()),
    loadListings() // load MLS listings from IndexedDB
]).then(([zipText, savedListings]) => {
    // Build ZIP → Town lookup
    zipText.split(/\r?\n/).forEach(line => {
        if (!line.trim()) return;
        const [zip, town] = line.split("|");
        zipLookup[zip.trim()] = town.trim();
    });

    // Convert array into object keyed by LIST_NO or fallback index
    mlsData = {};
    savedListings.forEach((item, idx) => {
        const key = item.LIST_NO || `IDX_${idx}`; // fallback key
        mlsData[key] = item;
    });

    // Render table immediately
    if (Object.keys(mlsData).length) {
        sortMLS_AZ();
    } else {
        document.getElementById("output").innerHTML = "<p>No MLS listings found. Import some first.</p>";
    }
});

/* -----------------------------
   Render Table + Pagination
----------------------------- */
function renderTable(items) {
    currentList = items;
    const totalPages = Math.ceil(items.length / itemsPerPage);
    if (currentPage > totalPages) currentPage = totalPages || 1;

    const start = (currentPage - 1) * itemsPerPage;
    const end = start + itemsPerPage;
    const pageItems = items.slice(start, end);

    if (!pageItems.length) {
        document.getElementById("output").innerHTML = "<p>No listings match your criteria.</p>";
        return;
    }

    let html = `
        <table>
            <tr>
                <th>Images</th>
                <th>MLS</th>
                <th>Price</th>
                <th>Address</th>
                <th>State</th>
                <th>County</th>
                <th>ZIP</th>
                <th>Bedrooms</th>
                <th>Bathrooms</th>
                <th>Rooms</th>
                <th>Sq Ft</th>
                <th>Remarks</th>
            </tr>
    `;

    for (const key of pageItems) {
        const item = mlsData[key];
        if (!item) continue;

        const mlsnum = item.LIST_NO || key;
        const price = item.LIST_PRICE || "—";
        const cleanStreetName = String(item.STREET_NAME || "").replace(/\s+/g, " ").trim();
        const streetNo = item.STREET_NO || "";
        const zip = item.ZIP_CODE || "";
        const zipTown = zipLookup[zip] || "";
        const state = item.STATE || "—";
        const county = item.COUNTY || "—";
        const remarks = item.REMARKS || "—";
        const bedrooms = item.NO_BEDROOMS || "—";
        const bathrooms = item.NO_FULL_BATHS || "—";
        const rooms = item.NO_ROOMS || "—";
        const squareFeet = item.SQUARE_FEET || "—";

        html += `
            <tr onclick="openListing('${mlsnum}')" style="cursor:pointer;">
                <td>
                    <img src="http://media.mlspin.com/photo.aspx?mls=${mlsnum}&n=0&w=120&h=90"
                         style="max-width:120px;max-height:90px;"
                         onerror="this.style.display='none'">
                </td>
                <td>${mlsnum}</td>
                <td>$${price}</td>
                <td>${streetNo} ${cleanStreetName}<br>${zipTown}, ${state}<br>${zip}</td>
                <td>${state}</td>
                <td>${county}</td>
                <td>${zip}</td>
                <td>${bedrooms}</td>
                <td>${bathrooms}</td>
                <td>${rooms}</td>
                <td>${squareFeet}</td>
                <td>
                    <div style="max-height:60px; overflow-y:auto; padding:4px;">
                        ${remarks}
                    </div>
                </td>
            </tr>
        `;
    }

    html += "</table>";

    html += `
        <div class="pagination">
            <button onclick="prevPage()" ${currentPage === 1 ? "disabled" : ""}>Previous</button>
            <span>Page ${currentPage} of ${totalPages}</span>
            <button onclick="nextPage()" ${currentPage === totalPages ? "disabled" : ""}>Next</button>
        </div>
    `;

    document.getElementById("output").innerHTML = html;
}

/* Pagination */
function nextPage() { currentPage++; renderTable(currentList); }
function prevPage() { currentPage--; renderTable(currentList); }

/* -----------------------------
   Sorting + Filtering
----------------------------- */
function sortMLS_AZ() {
    currentPage = 1;
    renderTable(Object.keys(mlsData).sort());
}

function sortMLS_ZA() {
    currentPage = 1;
    renderTable(Object.keys(mlsData).sort().reverse());
}

function sortTownAZ() {
    currentPage = 1;
    const sorted = Object.keys(mlsData).sort((a, b) => {
        const townA = (zipLookup[mlsData[a]?.ZIP_CODE] || "").toLowerCase();
        const townB = (zipLookup[mlsData[b]?.ZIP_CODE] || "").toLowerCase();
        return townA.localeCompare(townB);
    });
    renderTable(sorted);
}

function sortTownZA() {
    currentPage = 1;
    const sorted = Object.keys(mlsData).sort((a, b) => {
        const townA = (zipLookup[mlsData[a]?.ZIP_CODE] || "").toLowerCase();
        const townB = (zipLookup[mlsData[b]?.ZIP_CODE] || "").toLowerCase();
        return townB.localeCompare(townA);
    });
    renderTable(sorted);
}

function PriceHigh() {
    currentPage = 1;
    const sorted = Object.keys(mlsData).sort((a, b) => {
        return (parseFloat(mlsData[b].LIST_PRICE) || 0) - (parseFloat(mlsData[a].LIST_PRICE) || 0);
    });
    renderTable(sorted);
}

function PriceLow() {
    currentPage = 1;
    const sorted = Object.keys(mlsData).sort((a, b) => {
        return (parseFloat(mlsData[a].LIST_PRICE) || 0) - (parseFloat(mlsData[b].LIST_PRICE) || 0);
    });
    renderTable(sorted);
}

function handleCounty() {
    currentPage = 1;
    const county = document.getElementById("countySelect").value;
    if (!county) return sortMLS_AZ();

    const filtered = Object.keys(mlsData).filter(key => mlsData[key]?.COUNTY === county);
    renderTable(filtered);
}

function searchRemarks() {
    currentPage = 1;
    const keyword = document.getElementById("remarkSearch").value.toLowerCase();
    if (!keyword.trim()) return sortMLS_AZ();

    const filtered = Object.keys(mlsData).filter(key => {
        return (mlsData[key]?.REMARKS || "").toLowerCase().includes(keyword);
    });

    renderTable(filtered);
}

/* -----------------------------
   Open Listing
----------------------------- */
function openListing(mls) {
    window.location.href = `details.html?mls=${mls}`;
}

/* -----------------------------
   Mobile Menu Toggle
----------------------------- */
function toggleMenu() {
    const menu = document.getElementById("menu");
    menu.style.display = menu.style.display === "block" ? "none" : "block";
}
document.querySelectorAll(".menu a").forEach(link => {
    link.addEventListener("click", () => {
        document.getElementById("menu").style.display = "none";
    });
});
</script>


</body>
</html>
