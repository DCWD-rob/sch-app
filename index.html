<!DOCTYPE html>
<html lang="en">
<head>
  <!-- iOS PWA support -->
  <link rel="apple-touch-icon" href="logo.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SCH">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stacey Curran Homes</title>

  <link rel="stylesheet" href="style.css">
  <script src="https://kit.fontawesome.com/0aacbb7f3b.js" crossorigin="anonymous"></script>
</head>

<body id="grad">
  <!-- Unified Header -->
  <header class="app-header">
    <div class="header-inner">
      <div class="logo">Stacey Curran Homes</div>

      <button class="menu-toggle" aria-label="Toggle navigation">
        <i class="fa-solid fa-bars"></i>
      </button>

      <nav class="nav-links">
        
        <a href="index.html" class="active">Home</a>
        <a href="mlssearch.html">Search Homes</a>
        <a href="aboutme.html">About Me</a>
        <a href="contact.html">Contact Us</a>
   
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="page-content home-hero">
    <section class="hero-card">
      <img src="logo.png" alt="Stacey Curran Homes logo" class="hero-logo">

      <h1>Stacey Curran Homes</h1>
      <h2>Connecting great people with great homes</h2>

      <p>
        Search homes, schedule showings, and connect directly with a local expert—
        all from one simple, mobile‑friendly app.
      </p>

    </section>
  </main>

  <script>
    // Mobile menu toggle
    const toggle = document.querySelector(".menu-toggle");
    const nav = document.querySelector(".nav-links");

    toggle.addEventListener("click", () => {
      nav.classList.toggle("show");
    });
  </script>
</body>
</html>
