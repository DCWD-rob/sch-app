<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Import MLS Listings</title>

<style>
    #convert{
        font-size: larger;
    }
/* Navbar container */
.mobile-nav {
  background: #6b3370;
  color: white;
  position: sticky;
  top: 0;
  z-index: 1000;
  width: 100%;
  box-sizing: border-box;
}

/* Navbar content: app title + hamburger */
.nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.75rem 1rem;
}

/* App title styling */
.app-title {
  font-size: 1.1rem;
  font-weight: bold;
  flex-shrink: 0;
}

/* Hamburger button */
.menu-btn {
  font-size: 1.8rem;
  background: none;
  border: none;
  color: white;
  cursor: pointer;
  flex-shrink: 0;
}

/* Menu container (dropdown) */
.menu {
  display: none;                /* hidden by default */
  flex-direction: column;       /* vertical stack */
  position: absolute;           /* dropdown under navbar */
  top: 100%;                    /* immediately below nav-bar */
  left: 0;
  width: 100%;                  /* full width */
  background: #7d4a82;
  z-index: 999;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

/* Menu links */
.menu a {
  display: block;
  padding: 0.9rem 1rem;
  color: white;
  text-decoration: none;
  border-top: 1px solid rgba(255,255,255,0.2);
}

/* Hover effect */
.menu a:hover {
  background: #998099;
}

/* Optional: auto-close menu on link click */
.menu a.close-on-click {
  cursor: pointer;
}
</style>
</head>

<body>
<header>
  <nav class="mobile-nav">
    <div class="nav-bar">
      <span class="app-title">MLS App</span>
      <button class="menu-btn" onclick="toggleMenu()">☰</button>
    </div>

    <div id="menu" class="menu">
      <a href="index.html">Home</a>
      <a href="contact.html">Contacts</a>
      <a href="agent_sales.html">Sales</a>
      <a href="open_house.html">Open House</a>
      <a href="mlssearch.html">Search Listings</a>
      <a href="convert.html">Import MLS</a>
    </div>
  </nav>
</header>

    <h2>IMPORT MLS LISTINGS</h2>
    <h3>1. Import all needed listing files<br></h3>
    <h3>2. press submit MLS Listings to app </h3>
    <button class = "convert" onclick="startImport()">Import MLS Listings</button>
    <button class="convert" onclick="exportJSON()" id="submitBtn" disabled>Submit MLS listings to App</button>
<div id="fileDisplay"></div>
<div id="nextStep"></div>
<button cl = "convert" onclick="exportJSON()" id="submitBtn" disabled>Submit MLS listings to App</button>


    <script>

        const DB_NAME = "MLS_APP";
const STORE_NAME = "listings";

function openDB() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);

        req.onupgradeneeded = e => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME, { autoIncrement: true });
            }
        };

        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}

async function saveListings(listings) {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, "readwrite");
    const store = tx.objectStore(STORE_NAME);

    listings.forEach(row => store.add(row));
    return tx.complete;
}

async function loadListings() {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, "readonly");
    const store = tx.objectStore(STORE_NAME);

    return new Promise(resolve => {
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result || []);
    });
}

async function clearListings() {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, "readwrite");
    tx.objectStore(STORE_NAME).clear();
}

        let allRows = [];
        let fileCount = 0;

        const fileInput = document.createElement("input");
        fileInput.type = "file";
        fileInput.accept = ".txt";

        function startImport() {
            allRows = [];
            fileCount = 0;
            document.getElementById("fileDisplay").innerHTML = "";
            document.getElementById("nextStep").innerHTML = "";
            document.getElementById("submitBtn").disabled = true;

            selectFile();
        }

        function selectFile() {
            fileInput.onchange = async () => {
                const file = fileInput.files[0];
                if (!file) return;

                fileCount++;
                document.getElementById("submitBtn").disabled = false;

                const text = await file.text();
                const rows = parseTxt(text);
                allRows.push(...rows);

                displayFile(file.name, rows);
                showNextButtons();
            };

            fileInput.click();
        }

        function showNextButtons() {
            document.getElementById("nextStep").innerHTML = `
                <button onclick="selectFile()">YES — Import another file</button>
                <button onclick="finishImport()">DONE — Finish importing</button>
            `;
        }

        function finishImport() {
            document.getElementById("nextStep").innerHTML = "";
        }

        function parseTxt(text) {
            const lines = text.split(/\r?\n/).filter(l => l.trim());
            if (lines.length === 0) return [];

            const headers = lines[0].split("|");
            const rows = [];

            for (let i = 1; i < lines.length; i++) {
                const cols = lines[i].split("|");
                const obj = {};
                headers.forEach((h, idx) => {
                    obj[h] = cols[idx] || "";
                });
                rows.push(obj);
            }

            return rows;
        }

        function displayFile(filename, rows) {
            const container = document.getElementById("fileDisplay");

            let html = `
                <div class="file-block">
                    <h3>${filename}</h3>
                    <p>Rows imported: ${rows.length}</p>
                    <div class="table-wrapper">
                        <table>
            `;

           

            html += `
                        </table>
                    </div>
                </div>
            `;

            container.innerHTML += html;
        }

        async function exportJSON() {
    if (allRows.length === 0) {
        alert("No data to save.");
        return;
    }

    await clearListings();          // optional: overwrite previous import
    await saveListings(allRows);

    alert(`Saved ${allRows.length} MLS listings to this device.`);
}
window.addEventListener("load", async () => {
    const saved = await loadListings();
    if (saved.length) {
        allRows = saved;
        document.getElementById("submitBtn").disabled = false;
        alert(`Loaded ${saved.length} saved MLS listings.`);
    }
});
   
        function toggleMenu() {
            const menu = document.getElementById("menu");
            menu.style.display = menu.style.display === "block" ? "none" : "block";
        }

        // Optional: auto-close after tap
        document.querySelectorAll(".menu a").forEach(link => {
            link.addEventListener("click", () => {
                document.getElementById("menu").style.display = "none";
            });
        });
    </script>

</body>
</html>
