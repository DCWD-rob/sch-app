    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stacey Curran Homes</title>
    <link rel="stylesheet" href="style.css">
</head>

<header>
    <nav class="header">
        <a href="index.html" class="headerbox">Home</a>
        <a href="contact.html" class="headerbox">Contacts</a>
        <a href="agent_sales.html" class="headerbox">Sales</a>
        <a href="open_house.html" class="headerbox">Open House</a>
    </nav>
</header>

<main class="container">

  <h2>Real Estate Tasks</h2>

  <label><strong>Select Job / Client</strong></label>
  <div class="job-controls">
    <select id="jobSelect"></select>
    <button id="newJobBtn">New Job</button>
  </div>

  <h3>Client Info</h3>
  <div class="form-grid">
    <input id="fname" placeholder="First name">
    <input id="lname" placeholder="Last name">
    <input id="address" placeholder="Address">
    <input id="phone" placeholder="Phone">
    <input id="email" placeholder="Email">
  </div>

  <h3>Tasks</h3>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Task</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="tasks"></tbody>
    </table>
  </div>

  <button id="saveBtn" class="primary">Save Data</button>
  <p id="message"></p>

</main>

</body>
