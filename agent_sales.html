<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real Estate Tasks</title>
<style>
  /* Hide sections by default */
  #clientInfo, #tasksSection, #saveBtn, #clientHeading, #tasksHeading {
    display: none;
  }
</style>
</head>
<body>

<header>
  <div class="header">
    <a href="index.html" class="headerbox">home</a>
    <a href="contact.html" class="headerbox">contacts</a>
    <a href="agent_sales.html" class="headerbox">sales</a>
    <a href="open_house.html" class="headerbox">open house</a>
  </div>
</header>

<h2>Real Estate Tasks</h2>

<label for="jobSelect"><strong>Select Job / Client</strong></label>
<select id="jobSelect"></select>

<h3 id="clientHeading">Client Info</h3>
<div id="clientInfo">
  <input id="fname" placeholder="First name">
  <input id="lname" placeholder="Last name">
  <input id="address" placeholder="Address">
  <input id="phone" placeholder="Phone">
  <input id="email" placeholder="Email">
</div>

<h3 id="tasksHeading">Tasks</h3>
<div id="tasksSection">
  <table>
    <thead>
      <tr>
        <th>Task</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="tasks"></tbody>
  </table>
</div>
<p id="message"></p>
<button id="saveBtn">Save Data</button>


<script>
const tasksList = [
  "mandatory licenses consumer",
  "MA-Exc buyers agency agreement",
  "facts for consumers",
  "lender approval",
  "deed",
  "MLS Listing",
  "contract to purchase Real estate",
  "offer deposit",
  "lead paint notice",
  "MA standard P and S agreement",
  "P and S deposit",
  "MA notice of designated agency",
  "TRID addendum",
  "sellers real estate info statement",
  "closing documents",
  "DA"
];

const tasksBody = document.getElementById("tasks");
const jobSelect = document.getElementById("jobSelect");
const clientInfo = document.getElementById("clientInfo");
const tasksSection = document.getElementById("tasksSection");
const saveBtn = document.getElementById("saveBtn");
const clientHeading = document.getElementById("clientHeading");
const tasksHeading = document.getElementById("tasksHeading");

let allJobs = JSON.parse(localStorage.getItem("allJobs")) || {};

// Seed pre-existing jobs if empty
if (Object.keys(allJobs).length === 0) {
  allJobs = {
    "Mort": { fname: "Mort", lname: "Smith", address: "123 Main St", phone: "555-1234", email: "mort@example.com", tasks: {} },
    "Tator": { fname: "Tator", lname: "Jones", address: "456 Oak St", phone: "555-5678", email: "tator@example.com", tasks: {} }
  };
  localStorage.setItem("allJobs", JSON.stringify(allJobs));
}

let currentJob = null;

function showSections() {
  clientInfo.style.display = "block";
  tasksSection.style.display = "block";
  saveBtn.style.display = "inline-block";
  clientHeading.style.display = "block";
  tasksHeading.style.display = "block";
}

function hideSections() {
  clientInfo.style.display = "none";
  tasksSection.style.display = "none";
  saveBtn.style.display = "none";
  clientHeading.style.display = "none";
  tasksHeading.style.display = "none";
}

function populateJobSelector() {
  jobSelect.innerHTML = "";

  // Placeholder first
  const placeholder = document.createElement("option");
  placeholder.value = "";
  placeholder.textContent = "-- Select Job / Client --";
  placeholder.disabled = true;
  placeholder.selected = true;
  jobSelect.appendChild(placeholder);

  // Existing jobs
  Object.keys(allJobs).forEach(jobName => {
    const option = document.createElement("option");
    option.value = jobName;
    option.textContent = jobName;
    jobSelect.appendChild(option);
  });

  // Create new job at bottom
  const createNewOption = document.createElement("option");
  createNewOption.value = "__create_new__";
  createNewOption.textContent = "-- Create New Job --";
  jobSelect.appendChild(createNewOption);

  hideSections();
}

function loadJob(jobName) {
  if (!jobName || !allJobs[jobName]) return;

  currentJob = jobName;
  const data = allJobs[jobName];

  document.getElementById("fname").value = data.fname || "";
  document.getElementById("lname").value = data.lname || "";
  document.getElementById("address").value = data.address || "";
  document.getElementById("phone").value = data.phone || "";
  document.getElementById("email").value = data.email || "";

  // Populate tasks table
  tasksBody.innerHTML = "";
  tasksList.forEach(task => {
    const status = data.tasks[task] || "Not Completed";
    const tr = document.createElement("tr");

    const tdTask = document.createElement("td");
    tdTask.textContent = task;

    const tdStatus = document.createElement("td");
    const select = document.createElement("select");
    ["Not Completed", "Completed"].forEach(val => {
      const option = document.createElement("option");
      option.value = val;
      option.textContent = val;
      select.appendChild(option);
    });
    select.value = status;
    tdStatus.appendChild(select);

    tr.appendChild(tdTask);
    tr.appendChild(tdStatus);
    tasksBody.appendChild(tr);
  });

  showSections();
}

function createNewJob() {
  const newJobName = prompt("Enter new job/client name:");
  if (!newJobName) return;
  if (allJobs[newJobName]) {
    alert("Job already exists!");
    return;
  }

  // Add empty job
  allJobs[newJobName] = { fname: "", lname: "", address: "", phone: "", email: "", tasks: {} };
  localStorage.setItem("allJobs", JSON.stringify(allJobs));

  populateJobSelector();
  jobSelect.value = newJobName;
  currentJob = newJobName;

  // Clear form
  document.getElementById("fname").value = "";
  document.getElementById("lname").value = "";
  document.getElementById("address").value = "";
  document.getElementById("phone").value = "";
  document.getElementById("email").value = "";

  tasksBody.innerHTML = "";
  tasksList.forEach(task => {
    const tr = document.createElement("tr");
    const tdTask = document.createElement("td");
    tdTask.textContent = task;

    const tdStatus = document.createElement("td");
    const select = document.createElement("select");
    ["Not Completed", "Completed"].forEach(val => {
      const option = document.createElement("option");
      option.value = val;
      option.textContent = val;
      select.appendChild(option);
    });
    tdStatus.appendChild(select);

    tr.appendChild(tdTask);
    tr.appendChild(tdStatus);
    tasksBody.appendChild(tr);
  });

  showSections();
}

function saveCurrentJob() {
  if (!currentJob) return;

  const data = {
    fname: document.getElementById("fname").value,
    lname: document.getElementById("lname").value,
    address: document.getElementById("address").value,
    phone: document.getElementById("phone").value,
    email: document.getElementById("email").value,
    tasks: {}
  };

  document.querySelectorAll("#tasks tr").forEach(row => {
    const task = row.children[0].textContent;
    const status = row.children[1].children[0].value;
    data.tasks[task] = status;
  });

  allJobs[currentJob] = data;
  localStorage.setItem("allJobs", JSON.stringify(allJobs));
  document.getElementById("message").textContent = "Saved ✔";
}

// Dropdown change
jobSelect.addEventListener("change", () => {
  const selected = jobSelect.value;
  if (selected === "__create_new__") {
    createNewJob();
  } else {
    loadJob(selected);
  }
  document.getElementById("message").textContent = "";
});

// Save button
saveBtn.addEventListener("click", saveCurrentJob);

// Initialize
populateJobSelector();
</script>

</body>
</html>
